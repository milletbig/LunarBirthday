[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-birthday"
dynamic = ["version"]
description = "把农历生日批量推算并转换为可导入日历的 ICS 提醒文件"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "customtkinter>=5.2.2",
    "lunar_python>=1.4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
lunar-birthday = "lunar_birthday.ui.app:main"

[tool.setuptools]
packages = ["lunar_birthday", "lunar_birthday.core", "lunar_birthday.ui"]

[tool.setuptools.dynamic]
version = {attr = "lunar_birthday.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
